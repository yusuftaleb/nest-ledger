# Weekly pull requests for outdated or vulnerable packages; the Checks workflow runs on each one.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Node's types follow the Node that Vercel runs (24), not the newest Node
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint (through eslint-config-next) doesn't support TypeScript 7 yet
      - dependency-name: typescript
        versions: [">=7"]
      # eslint-config-next's plugins (import, jsx-a11y, react) don't support ESLint 10 yet
      - dependency-name: eslint
        versions: [">=10"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
